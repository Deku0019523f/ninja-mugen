<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninja Mugen</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#05060c;font-family:"Trebuchet MS","Arial Black",Impact,sans-serif;color:#fff}
#view{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1a1d3a,#05060c)}
#view canvas{image-rendering:pixelated}
#ui{position:fixed;overflow:hidden;pointer-events:none}
#ui>*{pointer-events:auto}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#screen{position:absolute;inset:0}
:root{--gold:#ffc83a;--org:#ff7a1a;--cy:#38e0ff;--dk:#0b0d1c}

/* ---------- HUD */
.hud-top{position:absolute;left:0;right:0;top:6px;height:70px}
.hud-team{position:absolute;top:0;width:262px;height:62px;display:flex;gap:4px;align-items:flex-start}
.hud-team.t0{left:10px}.hud-team.t1{right:10px;flex-direction:row-reverse}
.hud-portrait{width:40px;height:40px;background:#111;border:2px solid #000;border-radius:6px;image-rendering:pixelated;box-shadow:0 0 0 1px #556}
.hud-bars{flex:1;position:relative}
.bar{position:relative;background:#0a0a12;border:2px solid #000;overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.t1 .bar{clip-path:polygon(9px 0,100% 0,100% 100%,0 100%)}
.bar.hp{height:16px;box-shadow:0 0 0 2px #2a3040}
.bar .fill,.bar .ghost{position:absolute;top:0;bottom:0;left:0}
.t1 .bar .fill,.t1 .bar .ghost{left:auto;right:0}
.bar.hp .fill{background:linear-gradient(#e8ff58,#40d040 55%,#1f8a2a)}
.t1 .bar.hp .fill{background:linear-gradient(#9ef7ff,#34c8e8 55%,#1f7aa8)}
.bar.hp .ghost{background:#ff6a2a}
.hud-team.low .bar.hp .fill{background:linear-gradient(#ffb0a0,#ff4040 55%,#a01818);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.6)}}
.bar.chi{height:9px;margin-top:3px;width:86%}
.t1 .bar.chi{margin-left:14%}
.bar.chi .fill{background:linear-gradient(#8ff,#19b5e8);transition:width .1s}
.bar.chi .lab{position:absolute;left:4px;top:-2px;font-size:8px;color:#fff;opacity:.35;letter-spacing:1px;font-weight:bold}
.t1 .bar.chi .lab{left:auto;right:4px}
.bar.chi.ready{box-shadow:0 0 6px var(--cy)}.bar.chi.ready .fill{background:linear-gradient(#fff,#ffe060 40%,#ff9a20);animation:blink .5s steps(2) infinite}
.bar.chi.ready .lab{opacity:1;color:#000}
.names{font-size:11px;font-weight:bold;letter-spacing:.5px;margin-top:3px;text-shadow:1px 1px 0 #000,0 0 4px #000;color:#cfe4ff;line-height:12px}
.names span{display:block}
.t1 .names{text-align:right}
.subs{display:flex;gap:3px;margin-top:2px}.sub{flex:1;height:3px;background:#222}.sub .fill{height:100%;background:#7f7;display:block}.sub.dead{opacity:.3}
.wins{width:20px;height:22px;background:#000;border:2px solid #ffcf3a;border-radius:6px;font-size:13px;text-align:center;line-height:18px;color:#ffcf3a;font-weight:bold;flex:none;margin-top:12px}
.hud-timer{position:absolute;left:50%;top:0;transform:translateX(-50%);width:84px;height:38px;background:#07080f;border:2px solid #000;border-radius:20px/18px;box-shadow:0 0 0 2px #2a3040;text-align:center;font-size:26px;line-height:34px;color:#ffb12a;font-weight:bold}
.combo{position:absolute;top:120px;font-size:20px;font-style:italic;font-weight:900;color:#ffe03a;text-shadow:2px 2px 0 #b22,0 0 8px #000;opacity:0;letter-spacing:1px;transition:opacity .2s}
.combo b{font-size:38px}.combo.c0{left:12px}.combo.c1{right:12px;text-align:right}
.combo.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(1.9)}100%{transform:scale(1)}}
.hud-msg{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:62px;font-style:italic;font-weight:900;letter-spacing:3px;color:#fff;opacity:0;text-shadow:0 4px 0 #c43,0 0 20px #f80,3px 3px 0 #000;pointer-events:none}
.hud-msg.pop{animation:msgpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes msgpop{0%{transform:scale(3) rotate(-4deg);opacity:0}100%{transform:scale(1);opacity:1}}
.hud-cut{position:absolute;left:0;right:0;top:140px;height:96px;display:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.82) 15%,rgba(0,0,0,.82) 85%,transparent);text-align:center;border-top:2px solid var(--c);border-bottom:2px solid var(--c)}
.hud-cut.go{display:block;animation:cut 1.1s forwards}
@keyframes cut{0%{transform:translateX(-120%)}15%{transform:translateX(0)}80%{transform:translateX(0);opacity:1}100%{transform:translateX(30%);opacity:0}}
.cut-name{font-size:16px;letter-spacing:6px;margin-top:10px;color:#ddd}.cut-tech{font-size:40px;font-style:italic;font-weight:900;text-shadow:3px 3px 0 #000}
.hud-flash{position:absolute;inset:0;background:#fff;opacity:0}.hud-flash.go{animation:fl .45s}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.hud-hint{position:absolute;right:8px;bottom:4px;font-size:10px;opacity:.5}
.hud-dmg{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:13px;display:none;text-shadow:1px 1px 0 #000;color:#ffe08a}

/* ---------- Menus */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:340px;max-width:520px;background:linear-gradient(160deg,rgba(14,16,36,.94),rgba(6,8,18,.94));border:2px solid #2a3560;border-left:6px solid var(--org);padding:18px 22px;box-shadow:0 10px 40px #000a;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.panel h2{font-size:26px;font-style:italic;letter-spacing:2px;color:var(--gold);text-shadow:2px 2px 0 #000;margin-bottom:6px}
.panel .sub{font-size:14px;line-height:20px;color:#cfd8ff;margin-bottom:10px}.panel .sub b{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:20px;padding:8px 12px;margin:3px 0;font-size:16px;font-weight:bold;letter-spacing:1px;cursor:pointer;color:#aab4dd;border-left:4px solid transparent;transition:.08s}
.row.sel{background:linear-gradient(90deg,rgba(255,122,26,.45),rgba(255,122,26,.05));color:#fff;border-left-color:var(--gold);padding-left:18px}
.row .val{color:var(--gold);font-size:14px}
.desc{margin-top:10px;font-size:12px;color:#8e9bd0;min-height:30px;line-height:15px}
.panel.main{left:auto;right:24px;top:auto;bottom:30px;transform:none;min-width:270px;max-width:300px}
.panel.main .row{font-size:14px;padding:6px 10px}.panel.main .desc{font-size:11px}
.logo{position:absolute;left:30px;top:50px}
.logo small{display:block;letter-spacing:8px;color:var(--cy);font-size:12px;text-shadow:0 0 8px var(--cy)}
.logo h1{font-size:64px;line-height:60px;font-style:italic;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 5px 0 var(--org),0 8px 0 #7a2a00,0 0 30px #ff7a1a88}
.logo em{display:block;margin-top:14px;font-size:14px;color:#ffd68a;letter-spacing:2px}
.foot{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#8a95c8;letter-spacing:1px}

.select{position:absolute;inset:0;background:linear-gradient(#0a0c1ccc,#05060ccc)}
.sel-head{position:absolute;left:14px;right:14px;top:10px;font-size:18px;font-style:italic;color:#cfe0ff;letter-spacing:1px}.sel-head b{color:var(--gold)}
.grid{position:absolute;left:14px;top:44px;width:420px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cell{aspect-ratio:1;background:#12162e;border:2px solid #2a3560;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#889;overflow:hidden}
.cell canvas{width:100%;height:100%;image-rendering:pixelated}
.cell.sel{border-color:var(--gold);box-shadow:0 0 10px var(--gold);z-index:2;transform:scale(1.12)}
.cell.picked{border-color:var(--cy);opacity:.55}
.side{position:absolute;right:12px;top:44px;width:190px;background:rgba(10,12,28,.9);border:2px solid #2a3560;border-top:4px solid var(--org);padding:8px 10px;text-align:center}
.side .prev{width:128px;height:128px;image-rendering:pixelated;background:radial-gradient(#2a3a6a,#0a0c1c)}
.side .nm{font-size:20px;font-style:italic;font-weight:900;color:var(--gold)}.side .ti{font-size:12px;color:#aab;margin-bottom:6px}
.b{display:flex;align-items:center;gap:6px;font-size:10px;margin:2px 0}.b span{width:58px;text-align:left;color:#9ab}.b i{flex:1;height:6px;background:#222;display:block}.b u{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--gold))}
.tc{margin-top:8px;font-size:11px;text-align:left;line-height:16px;color:#cfe0ff}.tc em{color:var(--cy);font-style:normal;font-weight:bold}

.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;width:420px}
.stg{padding:26px 8px;text-align:center;background:#14183a;border:2px solid #2a3560;font-weight:bold;font-size:13px;cursor:pointer}
.stg.sel{border-color:var(--gold);box-shadow:0 0 12px var(--gold);background:#2a2a5a}

.vs{position:absolute;inset:0;background:radial-gradient(circle,#1a2250cc,#05060cee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.vs-title{font-size:34px;font-style:italic;font-weight:900;color:var(--gold);letter-spacing:3px;text-shadow:3px 3px 0 #000}
.vs-row{display:flex;align-items:center;gap:20px}.vs-side{display:flex;gap:12px}
.vs-c{text-align:center;width:120px}.vs-c canvas{width:96px;height:96px;border:3px solid var(--gold);background:#0a0c1c;image-rendering:pixelated}
.vs-side.r .vs-c canvas{border-color:var(--cy);transform:scaleX(-1)}
.vs-c b{display:block;font-size:15px;margin-top:4px}.vs-c i{font-size:11px;color:#9ab;font-style:normal}
.vs-x{font-size:60px;font-style:italic;font-weight:900;color:#f43;text-shadow:3px 3px 0 #000,0 0 20px #f80}
.vs-diff{font-size:13px;color:#aab}

.ctrl table{border-collapse:collapse;font-size:13px;margin:6px 0 10px}.ctrl td,.ctrl th{padding:3px 12px;border-bottom:1px solid #2a3560;text-align:center}.ctrl td:first-child{text-align:left;color:#cfe0ff}
.ctrl th{color:var(--gold)}.ctrl ul{font-size:12px;line-height:18px;color:#aab;padding-left:16px}
.pause{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}.pause .panel{position:relative;left:auto;top:auto;transform:none}

/* ---------- Tactile */
#touch{display:none;position:fixed;inset:auto 0 0 0;height:50vh;pointer-events:none;z-index:9}
.is-touch #touch .dpad,.is-touch #touch .acts{pointer-events:auto}
#touch button{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:#1a2040aa;color:#fff;font-size:22px;font-weight:bold;touch-action:none}
#touch button.on{background:#ff7a1acc}
.dpad{position:absolute;left:10px;bottom:10px;width:200px;height:200px}
.dpad .u{left:68px;top:0}.dpad .d{left:68px;bottom:0}.dpad .l{left:0;top:68px}.dpad .r{right:0;top:68px}
.acts{position:absolute;right:10px;bottom:10px;width:230px;height:200px}
.b1{right:0;bottom:70px}.b2{right:76px;bottom:20px}.b3{right:76px;bottom:110px}.b4{right:152px;bottom:70px}.b5{right:152px;bottom:150px;background:#c02030aa!important}
</style>
</head>
<body>
<div id="view"></div>
<div id="ui"><div id="hud"></div><div id="screen"></div></div>
<div id="touch">
  <div class="dpad">
    <button data-a="u" class="u">▲</button><button data-a="l" class="l">◀</button><button data-a="r" class="r">▶</button><button data-a="d" class="d">▼</button>
  </div>
  <div class="acts">
    <button data-a="punch" class="b1">P</button><button data-a="kick" class="b2">K</button><button data-a="special" class="b3">S</button>
    <button data-a="move2" class="b4">T</button><button data-a="super" class="b5">★</button>
  </div>
</div>
