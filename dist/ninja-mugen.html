/* Base : plein écran paysage. L'interface (#ui) fait 480 px de haut et VW px de large (640 à 1200), mise à l'échelle par main.js */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:root{
  --gold:#ffc83a;--org:#ff7a1a;--amb:#ffa11f;--cy:#38e0ff;--ok:#35d49a;--red:#ff4d5e;--vio:#9a7bff;
  --dk:#0b0d1c;--ink:#060818;--ink2:#0a0e28;--ind:#121843;--line:#232b5c;--line2:#3a4690;
  --tx:#e9edff;--mut:#8f9bd0;
  --f-ui:"Rajdhani","Arial Narrow",Impact,sans-serif;--f-body:"Inter","Segoe UI",Arial,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#05060c;font-family:var(--f-body);color:var(--tx);touch-action:none}
#view{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#1a1d3a,#05060c)}
#view canvas{image-rendering:pixelated}
#ui{position:fixed;overflow:hidden;pointer-events:none;z-index:2}
#ui>*{pointer-events:auto}
#hud{position:absolute;inset:0;pointer-events:none;display:none;font-family:var(--f-ui)}
#screen{position:absolute;inset:0;font-family:var(--f-ui)}
#ui.shelled #screen{top:48px}

/* voile derrière les menus : assombrit et (en option) floute le décor 3D */
#veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.5px) 0 0/8px 8px,
             radial-gradient(900px 420px at 28% 38%,rgba(70,50,150,.22),transparent 70%),
             linear-gradient(180deg,rgba(5,6,22,.80),rgba(4,5,18,.93))}
#veil.on{opacity:1}
#veil.heavy{background:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1.5px) 0 0/8px 8px,linear-gradient(180deg,rgba(4,5,18,.90),rgba(3,4,14,.96))}
@supports (backdrop-filter:blur(2px)){#veil.blur{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}}

#backbtn,#pausebtn{display:none;position:fixed;z-index:12;background:#0b0d1cdd;color:#fff;border:1px solid #ffffff44;border-radius:8px;font:700 15px var(--f-ui);letter-spacing:1px;padding:9px 16px;touch-action:manipulation}
#backbtn{left:12px;bottom:12px}
#pausebtn{left:50%;transform:translateX(-50%);top:calc(100vh * 54 / 480);padding:5px 18px;letter-spacing:3px;opacity:.8}
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#05060cf5;color:#fff;align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:20px;line-height:28px;font-family:var(--f-ui)}
#rotate .ph{font-size:70px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){.is-touch #rotate{display:flex}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

/* Composants d'interface partagés : plaques biseautées, boutons, puces, onglets, curseur shuriken, transition « coup de sabre » */
.plate{position:relative;border:1px solid var(--line);border-left:3px solid var(--acc,var(--line2));
  background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px) 0 0/7px 7px,linear-gradient(160deg,rgba(20,26,72,.88),rgba(7,9,27,.92));
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));box-shadow:0 8px 24px #0008}
.plate.org{--acc:var(--org)}.plate.cy{--acc:var(--cy)}.plate.gold{--acc:var(--gold)}
.plate-h{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;font:700 17px var(--f-ui);letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.plate-h .pic{font-size:20px}
.plate-h.gold{color:var(--gold)}.plate-h.cy{color:var(--cy)}.plate-h.org{color:var(--org)}

/* en-tête de page : retour | titre | action */
.pg-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:54px;padding:0 18px;border-bottom:1px solid var(--line)}
.pg-head h2{font:700 28px var(--f-ui);letter-spacing:1.5px;text-transform:uppercase;text-align:center;color:#fff;line-height:1}
.pg-head h2 small{display:block;margin-top:3px;font:600 11px var(--f-ui);letter-spacing:2.5px;color:var(--org)}
.pg-head .l{justify-self:start}.pg-head .r{justify-self:end;display:flex;align-items:center;gap:10px;font:600 13px var(--f-ui);letter-spacing:1.5px;color:var(--mut)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:7px 16px;border:1px solid var(--line2);border-radius:6px;background:rgba(12,17,50,.88);color:var(--tx);font:700 15px var(--f-ui);letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:border-color .1s,background .1s}
.btn:hover,.btn:focus-visible{border-color:var(--org);background:rgba(34,24,40,.9)}
.btn .pic{font-size:18px}
.btn.alt{border-color:#c4600d;background:linear-gradient(#ff8a2a,#e0610f);color:#1b0c00;box-shadow:0 0 14px #ff7a1a55}
.btn-main{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 30px;border:0;border-radius:4px;transform:skewX(-10deg);background:linear-gradient(100deg,#ff6a10,#ffb21f 70%,#ffc94a);color:#1b0c00;cursor:pointer;touch-action:manipulation;box-shadow:0 0 0 1px #ffd27a88 inset,0 4px 0 #a2400a,0 0 22px #ff7a1a88;animation:pulse 1.9s ease-in-out infinite}
.btn-main>span{display:inline-flex;align-items:center;gap:10px;transform:skewX(10deg);font:700 22px var(--f-ui);letter-spacing:2px;text-transform:uppercase}
.btn-main .pic{font-size:24px}
.btn-main:hover{filter:brightness(1.08)}.btn-main:active{transform:skewX(-10deg) translateY(2px);box-shadow:0 0 0 1px #ffd27a88 inset,0 2px 0 #a2400a}
.btn-main[disabled]{filter:grayscale(.8) brightness(.6);animation:none;cursor:default}
@keyframes pulse{0%,100%{box-shadow:0 0 0 1px #ffd27a88 inset,0 4px 0 #a2400a,0 0 16px #ff7a1a66}50%{box-shadow:0 0 0 1px #ffd27a88 inset,0 4px 0 #a2400a,0 0 30px #ffa21fcc}}

.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 8px;border-left:3px solid var(--tc,var(--cy));background:#0b1230d9;color:var(--tc,var(--cy));font:700 11.5px var(--f-ui);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.tag .pic{font-size:14px}
.tag.org{--tc:var(--org)}.tag.gold{--tc:var(--gold)}.tag.ok{--tc:var(--ok)}.tag.red{--tc:var(--red)}

.pic{display:inline-flex;align-items:center;justify-content:center;font-size:1.15em;line-height:1}
.pic svg{display:block}
.pic-txt{font:700 .78em var(--f-ui);letter-spacing:.5px;padding:0 5px;border:1.5px solid currentColor;border-radius:5px;line-height:1.4}
.pic-sep{font:700 .8em var(--f-ui);opacity:.75;margin:0 1px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border:1px solid var(--cc,var(--line2));border-radius:5px;background:color-mix(in srgb,var(--cc,#3a4690) 14%,#070a20);color:var(--cc,var(--tx));font:700 15px var(--f-ui);letter-spacing:.5px;white-space:nowrap}
.chip.red{--cc:#ff5c78}.chip.gold{--cc:var(--gold)}.chip.cy{--cc:var(--cy)}.chip.vio{--cc:var(--vio)}.chip.grey{--cc:#9aa6d8}
.chip.fill{background:linear-gradient(#ff8a2a,#e0610f);border-color:#ffb066;color:#1b0c00}
.chip.txt{font-size:13px;letter-spacing:.8px;text-transform:uppercase}

.seg{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#060920cc}
.seg>b{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:6px;font:700 13.5px var(--f-ui);letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);cursor:pointer;touch-action:manipulation}
.seg>b.on{background:linear-gradient(#ff8a2a,#ec6a14);color:#1b0c00}
.seg>b:not(.on):hover{color:#fff}

/* curseur : shuriken qui tourne devant l'option active */
.cur::before{content:"";position:absolute;left:8px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--shuriken) center/contain no-repeat;opacity:0;transform:scale(.4);transition:opacity .1s,transform .1s;pointer-events:none}
.cur.sel::before{opacity:1;transform:scale(1);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* transition « coup de sabre » : un trait de lame balaie l'écran en diagonale et dévoile le nouvel écran */
#slash{position:absolute;inset:0;z-index:30;pointer-events:none;display:none;overflow:hidden}
#slash.go{display:block}
#slash i{position:absolute;inset:-5%;background:#05061a;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);animation:slashcover .34s cubic-bezier(.5,0,.3,1) forwards}
#slash b{position:absolute;top:-20%;bottom:-20%;left:0;width:5px;background:linear-gradient(#0000,#fff 30%,#ffd27a 70%,#0000);box-shadow:0 0 18px 5px #ff9a2acc;transform:skewX(-14deg);animation:slashblade .34s cubic-bezier(.5,0,.3,1) forwards}
@keyframes slashcover{from{clip-path:polygon(0 0,100% 0,100% 100%,-30% 100%)}to{clip-path:polygon(135% 0,100% 0,100% 100%,105% 100%)}}
@keyframes slashblade{from{left:-3%;opacity:1}to{left:112%;opacity:.2}}

/* Barre de navigation (shell) */
#shell{display:none;position:absolute;left:0;right:0;top:0;height:48px;z-index:6;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:linear-gradient(#000,#03040e);border-bottom:1px solid #1d2552}
.sh-brand{display:flex;align-items:center;gap:9px;min-width:170px;font:700 20px var(--f-ui);letter-spacing:1px;color:#fff}
.sh-logo{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:7px;background:linear-gradient(135deg,#ff8a2a,#e0610f);color:#1b0c00;font-size:20px}
.sh-tabs{display:flex;gap:6px}
.sh-tab{padding:7px 18px;border:0;border-radius:5px;background:transparent;color:#d3d9ff;font:700 17px var(--f-ui);letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:background .1s,color .1s}
.sh-tab:hover{color:#fff;background:#ffffff12}
.sh-tab.on{background:linear-gradient(#ff7a1a,#e8620f);color:#1b0c00;box-shadow:0 0 14px #ff7a1a88}
.sh-tab.dis{opacity:.36}
.sh-snd{display:flex;align-items:center;justify-content:center;width:44px;height:34px;border:1px solid #2a3570;border-radius:6px;background:#0b1130;color:var(--org);font-size:21px;cursor:pointer;touch-action:manipulation}
.sh-snd.off{color:#6d78b0}
#ui.compact .sh-name{display:none}#ui.compact .sh-brand{min-width:44px}
#ui.compact .sh-tab{padding:7px 11px;font-size:15px}
.toast{position:absolute;left:50%;bottom:22px;z-index:40;max-width:80%;transform:translate(-50%,10px);padding:9px 18px;border:1px solid var(--org);border-left-width:4px;background:#0b1030f2;color:#fff;font:600 15px var(--f-ui);letter-spacing:.5px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* HUD de combat — pensé pour un écran large (VW × 480) */
.hud-top{position:absolute;left:0;right:0;top:8px;height:74px}
.hud-team{position:absolute;top:0;width:calc(50% - 78px);max-width:420px;height:66px;display:flex;gap:6px;align-items:flex-start}
.hud-team.t0{left:26px}.hud-team.t1{right:26px;flex-direction:row-reverse}
.hud-portrait{width:46px;height:46px;background:#111;border:3px solid #f3b230;border-radius:50%;image-rendering:pixelated;box-shadow:0 0 0 2px #000,0 0 8px #000a}
.hud-bars{flex:1;position:relative}
.bar{position:relative;background:#0a0a12;border:2px solid #000;overflow:hidden;border-radius:7px}
.bar.hp{height:13px;box-shadow:0 0 0 1px #2a3040;border-radius:7px;clip-path:none}
.bar .fill,.bar .ghost{position:absolute;top:0;bottom:0;left:0}
.t1 .bar .fill,.t1 .bar .ghost{left:auto;right:0}
.bar.hp .fill{background:linear-gradient(#ffd27a,#ff9a1f 55%,#e0620a)}
.t1 .bar.hp .fill{background:linear-gradient(#ffd27a,#ff9a1f 55%,#e0620a)}
.bar.hp .ghost{background:#ff6a2a}
.hud-team.low .bar.hp .fill{background:linear-gradient(#ffb0a0,#ff4040 55%,#a01818);animation:blink .4s steps(2) infinite}
@keyframes blink{50%{filter:brightness(1.6)}}
.bar.chi{height:8px;margin-top:3px;width:70%}
.t1 .bar.chi{margin-left:30%}
.bar.chi .fill{background:linear-gradient(#8ff,#19b5e8);transition:width .1s}
.bar.chi .lab{position:absolute;left:5px;top:-2px;font-size:8px;color:#fff;opacity:.35;letter-spacing:1px;font-weight:bold}
.t1 .bar.chi .lab{left:auto;right:5px}
.bar.chi.ready{box-shadow:0 0 6px var(--cy)}.bar.chi.ready .fill{background:linear-gradient(#fff,#ffe060 40%,#ff9a20);animation:blink .5s steps(2) infinite}
.bar.chi.ready .lab{opacity:1;color:#000}
.names{font-size:15px;font-weight:700;letter-spacing:1px;margin-top:3px;text-shadow:1px 1px 0 #000,0 0 4px #000;color:#cfe4ff;line-height:13px}
.names span{display:block}
.t1 .names{text-align:right}
.subs{display:flex;gap:3px;margin-top:2px}.subs .sub{flex:1;height:3px;background:#222}.subs .sub .fill{height:100%;background:#7f7;display:block}.subs .sub.dead{opacity:.3}
.wins{width:22px;height:24px;background:#000;border:2px solid #ffcf3a;border-radius:6px;font-size:14px;text-align:center;line-height:20px;color:#ffcf3a;font-weight:bold;flex:none;margin-top:14px}
.hud-timer{position:absolute;left:50%;top:0;transform:translateX(-50%);width:88px;height:40px;background:#07080f;border:2px solid #000;border-radius:20px/18px;box-shadow:0 0 0 2px #2a3040;text-align:center;font-size:27px;line-height:36px;color:#ffb12a;font-weight:bold}
.combo{position:absolute;top:104px;font-size:21px;font-style:italic;font-weight:900;color:#ffe03a;text-shadow:2px 2px 0 #b22,0 0 8px #000;opacity:0;letter-spacing:1px;transition:opacity .2s}
.combo b{font-size:40px}.combo.c0{left:28px}.combo.c1{right:28px;text-align:right}
.combo.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(1.9)}100%{transform:scale(1)}}
.hud-msg{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:68px;font-style:italic;font-weight:900;letter-spacing:3px;color:#fff;opacity:0;text-shadow:0 4px 0 #c43,0 0 20px #f80,3px 3px 0 #000;pointer-events:none}
.hud-msg.pop{animation:msgpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes msgpop{0%{transform:scale(3) rotate(-4deg);opacity:0}100%{transform:scale(1);opacity:1}}
.hud-cut{position:absolute;left:0;right:0;top:140px;height:96px;display:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.82) 12%,rgba(0,0,0,.82) 88%,transparent);text-align:center;border-top:2px solid var(--c);border-bottom:2px solid var(--c)}
.hud-cut.go{display:block;animation:cut 1.1s forwards}
@keyframes cut{0%{transform:translateX(-120%)}15%{transform:translateX(0)}80%{transform:translateX(0);opacity:1}100%{transform:translateX(30%);opacity:0}}
.cut-name{font-size:16px;letter-spacing:6px;margin-top:10px;color:#ddd}.cut-tech{font-size:40px;font-style:italic;font-weight:900;text-shadow:3px 3px 0 #000}
.hud-flash{position:absolute;inset:0;background:#fff;opacity:0}.hud-flash.go{animation:fl .45s}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.hud-hint{position:absolute;right:10px;top:84px;font-size:10px;opacity:.45}
.is-touch .hud-hint{display:none}
.hud-dmg{position:absolute;left:0;right:0;top:84px;text-align:center;font-size:13px;display:none;text-shadow:1px 1px 0 #000;color:#ffe08a}
.hud-combos{position:absolute;left:28px;top:112px;font-size:10px;line-height:14px;color:#ffe9b0;background:#0008;padding:6px 8px;border-left:3px solid var(--org);display:none;text-shadow:1px 1px 0 #000}
.hud-combos b{color:var(--cy)}

/* compteur de combo : orange, penché, du côté de l'attaquant */
.combo{top:150px;color:#ff9a1f;text-shadow:2px 2px 0 #5a1a00,0 0 8px #000;font-size:15px}
.combo small{font-size:15px;margin-right:4px;text-transform:lowercase;opacity:.9}
.combo b{font-size:44px;font-family:inherit}
/* chiffres de dégâts */
.hud-floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dn{position:absolute;transform:translate(-50%,0);font-size:20px;font-weight:900;font-style:italic;color:#ff3a2a;text-shadow:2px 2px 0 #000,0 0 6px #000;animation:dnup .9s ease-out forwards;white-space:nowrap}
.dn.mine{color:#ff6a3a}
.dn.crit{font-size:34px;color:#ffd23a;text-shadow:2px 2px 0 #b01010,0 0 10px #f50}
@keyframes dnup{0%{transform:translate(-50%,10px) scale(1.7);opacity:0}15%{opacity:1;transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-48px) scale(.9);opacity:0}}
/* compétences : disques de chargement (le disque sombre se vide à mesure que la jauge se remplit) */
.hud-skills{display:flex;gap:5px;margin-top:4px}
.t1 .hud-skills{justify-content:flex-end}
.sk{position:relative;width:24px;height:24px;border-radius:50%;background:#1b2540;border:2px solid #000;box-shadow:0 0 0 1px #56627f;overflow:hidden;font-size:10px;font-weight:900;color:#9fb0d8;text-align:center;line-height:20px}
.sk i{position:absolute;inset:0;background:conic-gradient(#0008 var(--p,360deg),transparent 0)}
.sk b{position:relative}
.sk.rdy{background:#e8a21f;color:#fff;box-shadow:0 0 0 1px #ffe08a,0 0 8px #ffb02e}
/* soutiens R1 / L1 : boutons ronds avec disque de recharge et compte à rebours */
.hud-sup{position:relative;width:32px;height:32px;border:2px solid #555;border-radius:50%;background:#0d122ccc;overflow:hidden}
.hud-sup.ready{border-color:#ffe066;box-shadow:0 0 8px #ffe066}.hud-sup.on{border-color:#6cf;box-shadow:0 0 8px #6cf}
.hud-sup .sp{display:block;margin:2px auto 0}
.hud-sup i{position:absolute;inset:0;background:conic-gradient(#000b var(--p,0deg),transparent 0)}
.hud-sup em{position:absolute;inset:0;font:900 14px/28px sans-serif;font-style:normal;text-align:center;color:#fff;text-shadow:0 0 3px #000,1px 1px 0 #000}
.hud-sup .k{position:absolute;right:2px;top:-1px;font:700 8px sans-serif;color:#fff;text-shadow:0 0 2px #000}
/* bannières peintes : lettres orange cernées de noir, trait lumineux derrière */
.hud-msg{font-size:74px;letter-spacing:2px;color:#ffe14a;-webkit-text-stroke:3px #1a0500;paint-order:stroke fill;text-shadow:0 5px 0 #c4310a,0 0 22px #ff7a00}
.hud-msg::before{content:'';position:absolute;left:0;right:0;top:50%;height:6px;background:linear-gradient(90deg,transparent,#ffb02e,#fff,#ffb02e,transparent);filter:blur(2px);z-index:-1}
.hud-msg.lose{color:#ff5a4a;text-shadow:0 5px 0 #5a0a0a,0 0 22px #c00}

/* Menus en liste : pages (Règles, Options), panneaux centrés (Résultat, Pause) et écran VS */
.lm.page{position:absolute;inset:0;display:flex;flex-direction:column}
.lm-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(220px,1fr);gap:22px;padding:12px 22px 14px}
.lm .list{overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:6px;padding-right:4px}
.lm-side{align-self:start;padding:16px 18px 18px;min-height:150px}
.lm-side h4{font:700 22px var(--f-ui);letter-spacing:1.5px;text-transform:uppercase;color:var(--cy);margin-bottom:8px}
.lm-side .desc{font:400 14px/21px var(--f-body);color:#c0c8ee}.lm-side .desc:empty{display:none}

.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:40px;padding:3px 12px 3px 40px;border:1px solid #232b5c;border-left:3px solid #36418a;background:linear-gradient(90deg,rgba(18,24,70,.8),rgba(8,11,34,.76));font:700 18px var(--f-ui);letter-spacing:1px;text-transform:uppercase;color:#cdd4ff;cursor:pointer;transition:background .1s,border-color .1s,color .1s}
.row.sel{border-color:var(--org);background:linear-gradient(90deg,rgba(255,122,26,.34),rgba(10,14,40,.78));color:#fff;box-shadow:0 0 16px #ff7a1a40}
.row .lb{white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.row .val{display:flex;align-items:center;gap:6px}
.row .val .v{min-width:130px;padding:3px 14px;text-align:center;border:1px solid #3a4690;border-radius:6px;background:#060920cc;color:var(--gold);font-size:17px;letter-spacing:1px;white-space:nowrap}
.row .ch{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:6px;color:#8a97d8;font-size:15px;cursor:pointer;touch-action:manipulation}
.row .ch:hover{color:var(--org);background:#ffffff12}
.row.go{margin-top:6px;border:0;padding-left:46px;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);background:linear-gradient(100deg,#ff6a10,#ffb21f 70%,#ffc94a);color:#1b0c00;font-size:21px;letter-spacing:2px;min-height:44px}
.row.go .lb{justify-content:space-between;width:100%}.row.go .lb .pic{font-size:22px}
.row.go.sel{filter:brightness(1.12)}

/* panneau centré : résultat, pause */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,88%);padding:22px 28px 20px;border:1px solid var(--line);border-left:4px solid var(--org);
  background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px) 0 0/7px 7px,linear-gradient(160deg,rgba(20,26,72,.94),rgba(6,8,26,.96));
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));box-shadow:0 10px 40px #000a}
.panel h2{font:700 38px var(--f-ui);font-style:italic;letter-spacing:2px;text-transform:uppercase;text-align:center;color:var(--gold);margin-bottom:6px;text-shadow:0 0 18px #ff8a2a66}
.panel .sub{text-align:center;font:400 15px/23px var(--f-body);color:#cfd8ff;margin-bottom:16px}.panel .sub b{color:var(--gold)}
.panel .list{max-height:300px;overflow:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:7px}
.panel .desc{margin-top:8px;font:400 13px/18px var(--f-body);color:#a9b5e6;text-align:center}.panel .desc:empty{display:none}
.panel .row{justify-content:center;padding-left:14px}.panel .row .lb{justify-content:center}
.pause{position:absolute;inset:0;background:#02030ccc;display:none;align-items:center;justify-content:center;z-index:5}
.pause .panel{position:relative;left:auto;top:auto;transform:none;width:min(430px,80%)}

/* écran VS */
.vs{position:absolute;inset:0;overflow:hidden;background:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/8px 8px,radial-gradient(ellipse at 50% 50%,#1a2054 0,#080a22 62%,#03040e)}
.vs::before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,rgba(255,122,26,.20) 0 49.7%,transparent 49.8% 50.2%,rgba(56,224,255,.18) 50.3%)}
.vs>*{position:relative}.vs{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.vs-title{font:700 36px var(--f-ui);font-style:italic;letter-spacing:4px;color:var(--gold);text-shadow:0 0 18px #ff8a2a77}
.vs-row{display:flex;align-items:center;gap:34px}.vs-side{display:flex;gap:14px}
.vs-c{text-align:center;width:168px}.vs-c canvas{width:136px;height:136px;border:2px solid var(--org);border-radius:10px;background:#070a20;image-rendering:pixelated;box-shadow:0 0 22px #ff7a1a66}
.vs-side.r .vs-c canvas{border-color:var(--cy);transform:scaleX(-1);box-shadow:0 0 22px #38e0ff66}
.vs-c b{display:block;margin-top:8px;font:700 24px var(--f-ui);letter-spacing:1.5px}.vs-c i{font:600 13px var(--f-ui);letter-spacing:1px;color:#9ab;font-style:normal}
.vs-x{font:700 84px var(--f-ui);font-style:italic;color:#fff;text-shadow:0 0 24px #ff5a1f,3px 3px 0 #b02a00}
.vs-diff{font:600 14px var(--f-ui);letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.foot{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:600 12.5px var(--f-ui);letter-spacing:1.6px;color:#7480b8;pointer-events:none}

/* ===== Kit commun (parchemin, pastilles, boutons) ===== */
:root{--parch:#fff1cf;--parch2:#f3dca4;--brown:#3a2410;--edge:#8a5a22;--yel:#f3b61f}
.stk,.hm-start em,.dia em,.tile em,.hr-plate b,.md-b b,.kit-top h2{color:#fff;-webkit-text-stroke:3px #1a0f05;paint-order:stroke fill;font-weight:800;letter-spacing:1px}
.parch{background:linear-gradient(#fff4d6,#f4dfab);color:var(--brown);border:3px solid #fff8e4;box-shadow:0 0 0 2px var(--edge),0 8px 22px #000a}
.ic{display:inline-block;width:20px;height:20px;flex:none;vertical-align:middle}
.ic.gold{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f3b61f 55%,#b8760a);border:2px solid #7a4a08}
.ic.gem{background:linear-gradient(135deg,#d9a8ff,#8a3fe0 60%,#4a1a90);clip-path:polygon(25% 5%,75% 5%,98% 40%,50% 98%,2% 40%)}
.ic.none{display:none}
.pills{display:flex;gap:12px}
.pill{display:flex;align-items:center;gap:8px;min-width:112px;height:34px;padding:0 10px 0 8px;border-radius:17px;background:linear-gradient(#0009,#000c);border:1px solid #ffffff22;color:#fff;font:800 18px var(--f-ui)}
.pill .ic{width:22px;height:22px}.pill b{flex:1;text-align:right;padding-right:4px}
.plus{width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:radial-gradient(#7be04a,#2f9a1a);color:#fff;font:900 20px/22px var(--f-ui);cursor:pointer;padding:0}
.kit-top{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px 0 14px;z-index:3}
.kit-top h2{flex:1;font-size:30px;margin:0}
.kit-back{width:44px;height:38px;border-radius:5px;border:2px solid #0a3a4a;background:linear-gradient(#58d8f0,#1590b5);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 #06303e}
.modal{position:absolute;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center}
.mbox{width:min(440px,92%);animation:mpop .25s cubic-bezier(.2,1.4,.4,1)}.mbox.wide{width:min(560px,94%)}
@keyframes mpop{0%{transform:scale(.7);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:center;position:relative;height:44px;background:linear-gradient(#ffd24a,#f0a912);border:3px solid #fff8e4;border-bottom:0;box-shadow:0 0 0 2px var(--edge);border-radius:6px 6px 0 0;font:800 24px var(--f-ui);color:var(--brown);letter-spacing:1px}
.mx{position:absolute;right:8px;top:6px;width:32px;height:32px;border:0;background:none;color:#fff;font:900 24px var(--f-ui);-webkit-text-stroke:2px #8a2a10;cursor:pointer}
.mbody{padding:14px 16px 16px;border-radius:0 0 6px 6px}
.mprof{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.mprof canvas{width:64px;height:64px;border:3px solid #38b0e8;background:#bfe8ff;image-rendering:pixelated}
.mprof label{flex:1}.mprof input{width:100%;box-sizing:border-box;height:38px;padding:0 10px;border:2px solid #7d8cb0;background:#aab6d6;color:#1a2440;font:800 20px var(--f-ui);border-radius:3px}
.mrow{display:flex;align-items:center;gap:12px;height:54px;border-top:2px dotted #c9aa6a;font:800 18px var(--f-ui)}
.mrow .mi{font-size:26px;display:flex;color:#6b4a1e}.mrow b{flex:1;letter-spacing:1px}
.sw{width:64px;height:32px;border-radius:16px;border:2px solid #3a2a10;background:#a09074;position:relative;cursor:pointer;padding:0}
.sw i{position:absolute;top:2px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #3a2a10;transition:left .15s}
.sw.on{background:linear-gradient(#5cf03a,#1fb81a)}.sw.on i{left:32px}
.more,.next,.dq-go{display:block;margin:12px auto 0;min-width:200px;height:46px;border:3px solid #fff8e4;border-radius:5px;background:linear-gradient(#ffe03a,#f0a912);box-shadow:0 0 0 2px var(--edge),0 4px 0 #8a5a22;color:var(--brown);font:800 22px var(--f-ui);letter-spacing:1px;cursor:pointer}

/* ===== Accueil ===== */
.home{position:absolute;inset:0;overflow:hidden}
.hm-logo{position:absolute;left:50%;top:6px;transform:translateX(-50%);font:900 26px var(--f-ui);font-style:italic;letter-spacing:3px;color:transparent;background:linear-gradient(#fff3c8 8%,#ffd062 45%,#ff8a1c 95%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 2px 0 #8a3a00)}
.hm-prof{position:absolute;left:14px;top:10px;display:flex;align-items:center;gap:10px;padding:4px 40px 4px 4px;border-radius:30px 6px 6px 30px;background:linear-gradient(90deg,#000b,#0006);color:#fff}
.hm-prof canvas{width:52px;height:52px;border-radius:50%;border:3px solid #f3b61f;background:#2a1a10;box-shadow:0 0 0 2px #000}
.hm-prof b{display:block;font:800 18px var(--f-ui);letter-spacing:.5px}.hm-prof span{display:flex;align-items:center;gap:5px;color:#ffc83a;font:800 17px var(--f-ui);font-style:italic}.hm-prof svg{width:18px;height:18px}
.hm-cur{position:absolute;right:16px;top:12px}
.hm-left{position:absolute;left:14px;top:96px;display:flex;flex-direction:column;gap:12px}
.tile{position:relative;width:76px;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0}
.tile span{width:56px;height:56px;border-radius:12px;background:radial-gradient(#6a3a20,#2a1608);border:2px solid #f3b61f;padding:7px;box-sizing:border-box;display:block}
.tile em{font:800 14px var(--f-ui);font-style:normal;-webkit-text-stroke:2.5px #1a0f05}
.tile.dot::after{content:'!';position:absolute;right:8px;top:-4px;width:20px;height:20px;border-radius:50%;background:#e8342a;border:2px solid #fff;color:#fff;font:900 14px/16px var(--f-ui);text-align:center}
.hm-hero{position:absolute;left:50%;top:50%;width:400px;height:400px;transform:translate(-50%,-50%);margin-top:6px;pointer-events:none}
.hm-hero canvas{position:absolute;inset:0;width:400px;height:400px;filter:drop-shadow(0 6px 0 #0006)}
.plat{position:absolute;left:50%;bottom:-10px;width:230px;height:66px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#0006 0 40%,transparent 70%);border:3px solid #ffffff55;display:flex;align-items:center;justify-content:center}
.plat::before{content:'';position:absolute;inset:-9px -18px;border-radius:50%;border:2px solid #ffffff33}
.plat i{position:absolute;bottom:-14px;font:800 20px var(--f-ui);font-style:normal;color:#fff8;opacity:.7}
.hm-bar{position:absolute;left:12px;bottom:4px;display:flex;gap:4px}
.padsel{min-width:112px;height:34px;line-height:28px;padding:0 10px;border:2px solid #3a2a10;border-radius:5px;background:linear-gradient(#58d8f0,#1590b5);color:#fff;font:800 14px var(--f-ui);-webkit-text-stroke:2px #0a3a4a;paint-order:stroke fill;cursor:pointer}
.plat.p2,.plat.p3{width:120px;height:36px;bottom:auto;top:calc(50% + 150px);opacity:.7;background:none}.plat.p2{left:calc(50% + 190px)}.plat.p3{left:calc(50% - 190px)}.plat.p2::before,.plat.p3::before{display:none}.plat.p2 i,.plat.p3 i{position:static;font-size:16px}
#ui.compact .plat.p2,#ui.compact .plat.p3{display:none}
.dia{background:none;border:0;cursor:pointer;width:96px;display:flex;flex-direction:column;align-items:center;gap:0;padding:0}
.dm{width:54px;height:54px;margin:12px 0 6px;transform:rotate(45deg);border:3px solid #fff3c8;background:linear-gradient(135deg,#f0a22a,#a85a12);box-shadow:0 0 0 2px #1a0f05,0 4px 8px #000a;display:flex;align-items:center;justify-content:center}
.dm i{transform:rotate(-45deg);font-size:32px;color:#fff;display:flex;filter:drop-shadow(0 2px 0 #3a1c08)}
.dia em{position:relative;font:800 15px var(--f-ui);font-style:normal;-webkit-text-stroke:3px #1a0f05;margin-top:-16px;z-index:1}
.dia:hover .dm{background:linear-gradient(135deg,#ffc34a,#d27a1a)}
.hm-start{position:absolute;right:16px;bottom:8px;width:116px;height:116px;border:0;background:none;cursor:pointer;padding:0;animation:stp 1.6s ease-in-out infinite}
@keyframes stp{50%{transform:scale(1.06)}}
.hm-start span{position:absolute;left:8px;top:2px;width:100px;height:100px;border-radius:50%;border:6px solid #f3b61f;background:radial-gradient(#3c1c0a,#140804);box-shadow:0 0 0 3px #1a0f05,0 0 18px #ff9a1f99;display:flex;align-items:center;justify-content:center;font-size:54px;color:#ffd24a}
.hm-start em{position:absolute;left:0;right:0;bottom:-2px;font:900 26px var(--f-ui);font-style:normal;-webkit-text-stroke:4px #1a0f05}
#ui.compact .hm-hero{width:330px;height:330px}#ui.compact .hm-hero canvas{width:330px;height:330px}#ui.compact .hm-logo{display:none}
#ui.compact .dia{width:76px}#ui.compact .dm{width:44px;height:44px}

/* ===== Sélection du mode ===== */
.md{position:absolute;inset:0}
.md-list{position:absolute;left:14px;top:62px;width:min(310px,38%);display:flex;flex-direction:column;gap:6px}
.md-b{display:flex;align-items:center;gap:10px;height:48px;padding:0 24px 0 4px;border:3px solid #1a0f05;border-radius:4px;cursor:pointer;text-align:left;clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%);background:linear-gradient(#f04a4a,#b81c24);position:relative}
.md-b .ic{width:42px;height:42px;border-radius:50%;background:radial-gradient(#3a2a60,#150a30);border:3px solid #f3b61f;color:#ffd24a;display:flex;align-items:center;justify-content:center;font-size:26px;margin-left:-4px}
.md-b b{font-size:22px;-webkit-text-stroke:3px #1a0f05}
.md-b.sel{background:linear-gradient(#38c8ee,#127fb8);border-color:#ffd24a;box-shadow:0 0 14px #ffd24aaa;transform:translateX(8px)}
.md-card{position:absolute;right:26px;top:80px;bottom:16px;width:min(480px,54%);background:linear-gradient(#e8c88a,#d6a95e);border:3px solid #8a5a22;border-radius:0 0 8px 8px;box-shadow:0 8px 22px #000a;color:#3a1c08;display:flex;flex-direction:column}
.beam{position:absolute;left:-16px;right:-16px;top:-30px;height:20px;border-radius:3px;background:linear-gradient(#d49a5a,#8a5a2a 60%,#5a3a18);border:2px solid #3a2410;box-shadow:0 3px 6px #0008}
.flag{position:absolute;top:-28px;width:26px;height:96px;background:linear-gradient(90deg,#c8201f,#e8342a 40%,#a81818);border:2px solid #3a1008;clip-path:polygon(0 0,100% 0,100% 100%,50% 88%,0 100%)}.flag.l{left:-10px}.flag.r{right:-10px}
.rib{height:44px;background:linear-gradient(#ffe9a8,#f0c860);border-bottom:3px solid #8a5a22;display:flex;align-items:center;justify-content:center}
.rib b{font:800 28px var(--f-ui);letter-spacing:2px;color:#fff;-webkit-text-stroke:3px #3a1c08;paint-order:stroke fill}
.md-in{flex:1;padding:14px 26px;overflow:auto;background:linear-gradient(#5a3a1acc,#3a2410cc)}
.md-in p{margin:4px 0 0;font:700 16px/22px var(--f-ui);text-align:center;color:#fff1cf;text-transform:uppercase;letter-spacing:.5px}
.rewbar{display:flex;align-items:center;gap:14px;margin:0 0 56px;padding:8px 14px;background:#2a1708d9;min-height:84px}.rewbar h4{margin:0;font:800 16px var(--f-ui);color:#fff;-webkit-text-stroke:2px #1a0f05;paint-order:stroke fill;letter-spacing:1px}
.tiles{display:flex;gap:10px;flex-wrap:wrap}.rtl{width:70px;text-align:center}.rtl span{position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:56px;margin:0 auto;border:3px solid #38b0e8;border-radius:4px;background:linear-gradient(#58c8f0,#1a78b0)}.rtl .ic{width:34px;height:34px}.rtl em{position:absolute;right:2px;bottom:0;font:900 14px var(--f-ui);font-style:normal;color:#fff;-webkit-text-stroke:3px #1a0f05;paint-order:stroke fill}.rtl small{display:block;margin-top:2px;font:700 10px/11px var(--f-ui);color:#ffe9b0}.rewbar .none{font:700 14px var(--f-ui);color:#ffe9b0}
.rews{display:flex;flex-wrap:wrap;gap:10px}.rw{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border:2px solid #38b0e8;background:#1a6a9a;color:#fff;font:700 15px var(--f-ui);border-radius:4px}.rw .ic{width:30px;height:30px}.rw .ic.none+span{padding-left:6px}
.md-card .next{position:absolute;right:14px;bottom:10px;margin:0;min-width:150px;height:40px;font-size:20px}

/* ===== Héros ===== */
.hr{position:absolute;inset:0}
.hr-stage{position:absolute;left:3%;top:50px;width:40%;height:318px}
.hr-stage canvas{position:absolute;left:50%;top:-6px;width:330px;height:330px;transform:translateX(-50%);filter:drop-shadow(0 6px 0 #0006)}
.hr-plate{position:absolute;left:0;bottom:0;display:flex;align-items:center;gap:8px;padding:4px 16px 4px 6px;background:linear-gradient(90deg,#000c,#0004)}
.hr-plate b{font-size:24px}.hr-plate small{color:#ffd9a0;font:700 13px var(--f-ui);letter-spacing:1px}
.rkb{display:flex;align-items:center;justify-content:center;width:38px;height:38px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#6a7488;color:#fff;font:900 24px var(--f-ui);font-style:italic;-webkit-text-stroke:2px #1a0f05;paint-order:stroke fill}
.rkb.rA{background:#9a50e0}.rkb.rS{background:linear-gradient(#ffe070,#f09a10)}
.hr-panel{position:absolute;right:16px;top:58px;width:min(480px,53%);height:300px;box-sizing:border-box;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.pn-lv{display:flex;align-items:center;gap:8px;height:30px;padding-left:6px;background:linear-gradient(90deg,#1a1208,#1a120800);color:#fff;font:800 20px var(--f-ui);margin:-2px -4px 0}
.drop{width:22px;height:26px;background:linear-gradient(#7fe8ff,#1a8ae0);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.pn-st{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.pn-st div{position:relative;height:46px;padding:3px 8px 3px 50px;background:linear-gradient(90deg,#8ad870aa,#8ad87000);border-radius:4px;display:flex;flex-direction:column;justify-content:center;font:700 12px var(--f-ui);color:#2a4a1a}
.pn-st div:nth-child(4){background:linear-gradient(90deg,#b8b0a0aa,#b8b0a000)}
.pn-st b{font:800 19px var(--f-ui);color:#0a6ab8}.pn-st u{text-decoration:none;font-size:12px;color:#0a8a3a;margin-left:6px}
.ico{position:absolute;left:3px;top:3px;width:40px;height:40px;border-radius:50%;background:radial-gradient(#6a4a30,#2a1608);border:2px solid #fff8e4;box-shadow:0 0 0 1px #1a0f05}
.ico::after{content:'';position:absolute;inset:8px;background:var(--c,#ffcf6a);clip-path:var(--cp,circle(50%))}
.ico.atk{--c:#ffd0a0;--cp:polygon(20% 40%,45% 20%,80% 30%,85% 70%,50% 85%,20% 70%)}.ico.hp{--c:#ff3a4a;--cp:polygon(50% 90%,8% 40%,22% 12%,50% 28%,78% 12%,92% 40%)}.ico.cd{--c:#ffa020;--cp:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%)}.ico.cr{--c:#fff;--cp:polygon(0 100%,80% 0,100% 20%,20% 100%)}
.pn-t{display:flex;align-items:baseline;gap:8px;height:24px;padding-left:6px;margin:2px -4px 0;background:linear-gradient(90deg,#1a1208,#1a120800);color:#fff}.pn-t b{font:800 17px var(--f-ui);letter-spacing:1px}.pn-t small{font:600 11px var(--f-ui);color:#ffd9a0}
.pn-un{display:flex;justify-content:space-around;margin-top:2px}
.pn-un div{width:62px;display:flex;flex-direction:column;align-items:center;gap:1px}
.pn-un span{font:800 14px var(--f-ui);color:#3a2410}
.pn-un em{width:46px;height:46px;border-radius:50%;background:radial-gradient(#3a3a44,#0e0e14);border:3px solid #cdbf9a;box-shadow:0 0 0 2px #1a0f05;display:flex;align-items:center;justify-content:center;padding:11px;box-sizing:border-box;font-style:normal;color:#7fe070;font-size:22px;font-weight:900}
.pn-un div.on em{background:radial-gradient(#ffd24a,#c8760a);padding:0}
.pn-bt{display:flex;gap:12px;margin-top:auto}
.pn-bt button{flex:1;height:42px;border-radius:4px;border:3px solid #fff8e4;box-shadow:0 0 0 2px var(--edge);font:800 22px var(--f-ui);cursor:pointer;color:#fff;-webkit-text-stroke:2.5px #1a0f05;paint-order:stroke fill;display:flex;align-items:center;justify-content:center;gap:6px}
.b-sel{background:linear-gradient(#5ad0f0,#1a90c0)}.b-sel.on{background:linear-gradient(#b8c8d0,#8aa0aa);cursor:default}
.b-up{background:linear-gradient(#7ee04a,#2f9a1a)}.b-up .ic{width:26px;height:26px}.b-up.dis{background:linear-gradient(#a0a8a0,#707870)}
.hr-strip{position:absolute;left:0;right:0;bottom:0;height:116px;padding:12px 14px 0;box-sizing:border-box;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;background:linear-gradient(#0000,#000b 18%,#000c);scrollbar-width:thin}
.hc{position:relative;flex:none;width:88px;height:100px;border:3px solid #6a7488;border-radius:4px;background:linear-gradient(#3a4a58,#18202a);cursor:pointer;overflow:visible}
.hc[data-rank=A]{border-color:#9a50e0}.hc[data-rank=S]{border-color:#f0b020}
.hc canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.hc .bd{position:absolute;left:-8px;top:-10px;width:30px;height:30px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:#6a7488;color:#fff;font:900 18px/30px var(--f-ui);text-align:center;-webkit-text-stroke:2px #1a0f05;paint-order:stroke fill}
.hc[data-rank=A] .bd{background:#9a50e0}.hc[data-rank=S] .bd{background:linear-gradient(#ffe070,#f09a10)}
.hc em{position:absolute;left:0;right:0;bottom:0;height:20px;background:#000b;color:#fff;font:800 14px/20px var(--f-ui);font-style:normal;text-align:center}
.hc .one{position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:#e07a10;border:2px solid #fff;color:#fff;font:900 14px var(--f-ui);display:none;align-items:center;justify-content:center;text-decoration:none}
.hc.sel{border-color:#8aff30;box-shadow:0 0 0 2px #1a0f05,0 0 16px #c8ff30;transform:translateY(-6px)}

/* ===== Cadeau quotidien ===== */
.dq-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dq-d{position:relative;width:104px;padding:6px 4px 8px;text-align:center;border:2px solid #c9aa6a;border-radius:8px;background:#fff8e4}
.dq-d small{display:block;font:800 13px var(--f-ui);color:#8a5a22}.dq-d span{display:block;width:38px;height:38px;margin:2px auto}
.dq-d b{display:flex;align-items:center;justify-content:center;gap:4px;font:800 18px var(--f-ui);color:#7a4a08}.dq-d b.g{color:#7a2ac0}.dq-d b .ic{width:18px;height:18px}
.dq-d.big{width:216px}.dq-d.big span{width:56px;height:56px}
.dq-d.done{opacity:.5}.dq-d.now{border-color:#e07a10;box-shadow:0 0 14px #ff9a1f;transform:translateY(-3px)}
.dq-d u{position:absolute;right:6px;top:2px;color:#2a9a3a;text-decoration:none;font-size:20px;font-weight:900}
.dq-go{min-width:240px}.dq-go.dis{background:#c0b49a;color:#7a6a4a;box-shadow:0 0 0 2px #a09070}
.dq-note{margin:8px 0 0;text-align:center;font:600 13px var(--f-ui);color:#6b4a1e}
.result .gain,.panel .gain{color:var(--gold);font-weight:700}

/* ===== Écran VS : fond coupé en diagonale ===== */
.vs{position:absolute;inset:0;overflow:hidden}
.vs::before,.vs::after{content:'';position:absolute;inset:0;z-index:0}
.vs::before{background:linear-gradient(110deg,#7a2a05cc,#1a0a04dd);clip-path:polygon(0 0,58% 0,42% 100%,0 100%)}
.vs::after{background:linear-gradient(110deg,#041a3add,#0a3a66cc);clip-path:polygon(58% 0,100% 0,100% 100%,42% 100%)}
.vs>*{position:relative;z-index:1}
.vs-x{position:relative;z-index:2;animation:vspop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes vspop{0%{transform:scale(4);opacity:0}100%{transform:scale(1);opacity:1}}
.vs-side.l .vs-c{animation:vsl .45s ease-out}.vs-side.r .vs-c{animation:vsr .45s ease-out}
@keyframes vsl{0%{transform:translateX(-160px);opacity:0}}@keyframes vsr{0%{transform:translateX(160px);opacity:0}}

/* ===== Histoire ===== */
.st{position:absolute;inset:0}
.st-tabs{position:absolute;left:14px;top:60px;display:flex;gap:8px}
.st-tab{height:36px;padding:0 16px;border:3px solid #1a0f05;border-radius:4px;background:linear-gradient(#f04a4a,#b81c24);color:#fff;font:800 18px var(--f-ui);cursor:pointer;-webkit-text-stroke:2px #1a0f05;paint-order:stroke fill}
.st-tab small{font-size:12px;-webkit-text-stroke:0;color:#ffe9a8;margin-left:4px}.st-tab i{display:inline-block;width:16px;height:16px;vertical-align:-3px;margin-right:4px}

.ctl-mid p{font:400 12px/17px var(--f-body);color:var(--mut);max-width:200px}

.sch .sd{fill:#0d1238;stroke:#3a4690;stroke-width:2}.sch .ss{fill:#070a22;stroke:#1d2552}.sch .sr{fill:#10163f;stroke:#4a58b0;stroke-width:2}.sch .sk{fill:#3a4690}
.sch .sb{fill:#0b1030;stroke:var(--org);stroke-width:1.8}.sch .sy{fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sch .sp,.sch .sp2{fill:#10163f;stroke:var(--cy);stroke-width:1.3}.sch .dp{fill:#10163f;stroke:#4a58b0;stroke-width:1.6}
.sch text{font:700 9px var(--f-ui);fill:var(--cy);letter-spacing:.5px}.sch .cap{font-size:8px;fill:var(--mut);letter-spacing:1.6px}
.ctl-mid.keys{justify-content:flex-start;padding-top:2px}
.kt{border-collapse:collapse;width:100%;font:600 13px var(--f-ui)}
.kt th{padding:2px 4px 5px;font-size:10.5px;letter-spacing:1.5px;color:var(--gold)}
.kt td{padding:2px 4px;border-top:1px solid #1c2350;text-align:center;color:#cfd8ff;font-size:12px}.kt td:first-child{text-align:left}
.kt .pic{font-size:15px}
kbd{display:inline-block;min-width:24px;padding:1px 6px;border:1px solid #4a58b0;border-bottom-width:3px;border-radius:5px;background:#10163f;font:700 12px var(--f-ui);color:#fff}
.kn{font:400 10.5px/14px var(--f-body);color:var(--mut)}
.ctl-foot{display:flex;justify-content:space-between;gap:12px;padding:6px 22px 9px;border-top:1px solid var(--line);margin-top:8px;font:500 14px var(--f-ui);letter-spacing:.8px;color:#aeb8ea}
.ctl-foot b{color:var(--org)}.ctl-foot span:last-child{color:var(--org)}
#ui.compact .ctl-body{grid-template-columns:1fr 1fr;padding:8px 10px 4px;gap:8px}#ui.compact .ctl-mid{display:none}
#ui.compact .cl{font-size:14px}#ui.compact .chip{padding:2px 6px;font-size:13px}

/* Multijoueur local : accueil, salon, recherche, salle de combat, bannière réseau */
.ol{position:absolute;inset:0;display:flex;flex-direction:column}
.ol-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 40px 22px}
.ol-hub{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:min(760px,100%)}
.ol-card{display:flex;align-items:center;gap:18px;padding:30px 24px;border:1px solid #2a3470;border-left:4px solid #3a47a0;background:linear-gradient(90deg,rgba(18,24,70,.78),rgba(7,10,32,.7));cursor:pointer;touch-action:manipulation;transition:background .12s,border-color .12s,transform .12s;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.ol-card .oc-i{display:flex;font-size:44px}.ol-card.org .oc-i{color:var(--org)}.ol-card.cy .oc-i{color:var(--cy)}
.ol-card b{display:block;font:700 26px var(--f-ui);letter-spacing:1.4px;color:#fff}
.ol-card small{display:block;margin-top:6px;font:400 14px/19px var(--f-body);color:#aab5e6}
.ol-card.sel{border-color:var(--org);background:linear-gradient(90deg,rgba(255,122,26,.3),rgba(10,14,40,.78));transform:translateY(-3px);box-shadow:0 0 22px #ff7a1a40}
.ol-card.cy.sel{border-color:var(--cy);background:linear-gradient(90deg,rgba(56,224,255,.22),rgba(10,14,40,.78));box-shadow:0 0 22px #38e0ff40}
.ol-foot{display:flex;align-items:center;gap:10px;font:600 14px var(--f-ui);letter-spacing:1px;color:var(--mut);text-align:center}
.ol-foot b{color:var(--gold)}.ol-foot .pic,.ol-foot svg{font-size:18px;color:var(--cy)}
.ol-err{display:flex;align-items:center;gap:8px;max-width:640px;padding:8px 14px;border:1px solid #7a2a3a;background:#2a0c1acc;color:#ffb0bd;font:500 14px/19px var(--f-body)}
.ol-mid{text-align:center}.ol-l{flex:1;text-align:center}
.radar{position:relative;width:130px;height:130px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.radar span{display:flex;font-size:44px;color:var(--cy);z-index:1}
.radar i{position:absolute;inset:0;border:2px solid var(--cy);border-radius:50%;opacity:0;animation:ping 2.4s ease-out infinite}
.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.25);opacity:.8}100%{transform:scale(1);opacity:0}}
.rd-t{font:600 20px/26px var(--f-ui);letter-spacing:1px;color:#e6ebff}.rd-t b{color:var(--gold)}.rd-t small{font:400 14px var(--f-body);color:#aab5e6;letter-spacing:0}
.ol-row{display:flex;gap:30px;align-items:stretch;width:min(820px,100%);min-height:0}
.ol-list{flex:1;display:flex;flex-direction:column;gap:8px;max-height:230px;overflow:auto;touch-action:pan-y}
.ol-empty{padding:22px;border:1px dashed #36418a;color:#aab5e6;font:500 16px/22px var(--f-body);text-align:center}.ol-empty small{display:block;margin-top:6px;font-size:13px;color:#8590c8}
.ol-host{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;border:1px solid #2a3470;border-left:3px solid var(--cy);background:linear-gradient(90deg,rgba(18,24,70,.78),rgba(7,10,32,.7));cursor:pointer}
.ol-host .oc-i{display:flex;font-size:22px;color:var(--cy)}.ol-host b{flex:1;font:700 22px var(--f-ui);letter-spacing:1.2px;color:#fff}
.ol-host i{display:flex;align-items:center;gap:4px;font:600 13px var(--f-ui);font-style:normal;letter-spacing:2px;color:var(--mut)}
.ol-host.sel{border-color:var(--org);background:linear-gradient(90deg,rgba(255,122,26,.3),rgba(10,14,40,.78))}.ol-host.sel i{color:var(--gold)}
.ol-vs{display:flex;align-items:center;gap:22px}.ol-x{font:700 40px var(--f-ui);font-style:italic;color:var(--gold)}
.ol-p{min-width:230px;padding:18px 22px;text-align:center}.ol-p small{display:block;font:600 13px var(--f-ui);letter-spacing:2px;color:var(--mut)}.ol-p b{display:block;margin-top:6px;font:700 28px var(--f-ui);letter-spacing:1.2px;color:#fff}
.ol-stats{display:flex;gap:34px}.kv{display:flex;flex-direction:column;align-items:center;gap:2px}.kv span{font:600 12px var(--f-ui);letter-spacing:2px;color:var(--mut);text-transform:uppercase}.kv b{font:700 20px var(--f-ui);color:var(--cy)}
.ol-wait{font:600 18px var(--f-ui);letter-spacing:1.5px;color:#aab5e6}
.ol-body .btn.sel{border-color:var(--org);color:#fff;box-shadow:0 0 14px #ff7a1a55}
.netmsg{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:9;padding:8px 20px;border:1px solid #7a5a1a;border-left:4px solid var(--org);background:#1a1204e6;color:#ffe2a8;font:700 17px var(--f-ui);letter-spacing:1px;display:none;white-space:nowrap}
.netmsg.on{display:block}
.compact .ol-hub{grid-template-columns:1fr}.compact .ol-body{gap:10px}
.ol-code{margin:6px auto 4px;display:inline-block;padding:6px 22px;border:2px dashed var(--gold);background:#1a1204cc;font:700 44px var(--f-ui);letter-spacing:10px;color:var(--gold);text-indent:10px}
.ol-in{display:block;margin:10px auto;width:230px;height:62px;text-align:center;text-transform:uppercase;font:700 38px var(--f-ui);letter-spacing:10px;text-indent:10px;color:#fff;background:#0b1030;border:2px solid var(--cy);outline:none}
.ol-in:focus{border-color:var(--org);box-shadow:0 0 14px #ff7a1a55}
.ol-sub{font:400 14px var(--f-body);color:#aab5e6;text-align:center}

/* Commandes tactiles façon manette : stick analogique OU croix à gauche, △ □ ○ ✕ à droite, L1 R1 au-dessus du losange, L2 R2 au-dessus du stick (paysage) */
:root{--bs:clamp(54px,17.5vh,96px)}
#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:9;touch-action:none}
.is-touch #padzone,.is-touch #acts,.is-touch #sups{pointer-events:auto}

/* zone de gauche : stick flottant ou croix */
#padzone{position:absolute;left:0;bottom:0;width:42%;height:78%;touch-action:none}
#stick,#dpad{position:absolute;left:calc(var(--bs)*.55);bottom:calc(var(--bs)*.4);width:calc(var(--bs)*2.5);height:calc(var(--bs)*2.5);pointer-events:none}
#stick{border-radius:50%;background:radial-gradient(circle,#ffffff10 0 55%,#ffffff2a 56% 60%,#0d122c66 61%);border:3px solid #ffffff66;opacity:.55;transition:opacity .15s}
#stick.act{opacity:1}
#stick .knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffc,#9aa6d8aa 45%,#2a3566cc);border:2px solid #fff9;box-shadow:0 4px 10px #0008}
#stick .ring{position:absolute;inset:14%;border-radius:50%;border:2px dashed #ffffff30}
#dpad{display:grid;grid-template-columns:1fr 1.1fr 1fr;grid-template-rows:1fr 1.1fr 1fr;gap:3%;opacity:.7}
#dpad.act{opacity:1}
#dpad i{display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;background:#141a3a99;border:2px solid #ffffff66;font-size:calc(var(--bs)*.5)}
#dpad i[data-d=u],#dpad i[data-d=d],#dpad i[data-d=l],#dpad i[data-d=r]{border-radius:14%}
#dpad i[data-d=ul],#dpad i[data-d=ur],#dpad i[data-d=dl],#dpad i[data-d=dr]{border-radius:50%;font-size:calc(var(--bs)*.36);background:#141a3a66;margin:12%}
#dpad i.mid{background:#ffffff12;border:2px solid #ffffff33;border-radius:50%;margin:8%}
#dpad i.on{background:#ff7a1add;border-color:#fff}

/* boutons d'action en losange (PlayStation) : △ haut, □ gauche, ○ droite, ✕ bas */
#acts{position:absolute;right:calc(var(--bs)*.45);bottom:calc(var(--bs)*.4);width:calc(var(--bs)*3);height:calc(var(--bs)*3);touch-action:none}
#acts .ab{position:absolute;width:var(--bs);height:var(--bs);border-radius:50%;border:3px solid;background:#141a3a99;font-size:calc(var(--bs)*.5);font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:inherit}
#acts .ab.on{background:#ff7a1add;color:#fff!important;border-color:#fff!important;transform:scale(.94)}
#acts .bt{left:50%;top:0;margin-left:calc(var(--bs)*-.5);color:#5fe0a0;border-color:#5fe0a0cc}
#acts .bb{left:50%;bottom:0;margin-left:calc(var(--bs)*-.5);color:#6aa8ff;border-color:#6aa8ffcc}
#acts .bl{left:0;top:50%;margin-top:calc(var(--bs)*-.5);color:#ff8ac8;border-color:#ff8ac8cc}
#acts .br{right:0;top:50%;margin-top:calc(var(--bs)*-.5);color:#ff6a6a;border-color:#ff6a6acc}

/* L1 R1 (soutiens) au-dessus du losange à droite ; L2 R2 (substitution, garde) de l'autre côté, au-dessus du stick à gauche */
#sups{display:contents}
#sups .sb{position:absolute;bottom:calc(var(--bs)*3.5);width:calc(var(--bs)*.95);height:calc(var(--bs)*.6);border-radius:calc(var(--bs)*.2);border:3px solid #ffe066cc;background:#141a3acc;color:#ffe066;font-size:calc(var(--bs)*.3);font-weight:900;display:flex;align-items:center;justify-content:center;font-family:inherit;user-select:none;touch-action:none}
#sups .sb[data-s=sup1]{right:calc(var(--bs)*.45)}
#sups .sb[data-s=sup2]{right:calc(var(--bs)*1.7)}
#sups .sb[data-s=l2],#sups .sb[data-s=r2]{border-color:#9ad0ffcc;color:#9ad0ff}
#sups .sb[data-s=l2]{left:calc(var(--bs)*1.1)}
#sups .sb[data-s=r2]{left:calc(var(--bs)*2.35)}
#sups .sb.on{background:#ff7a1add;color:#fff;border-color:#fff;transform:scale(.94)}
</style>
