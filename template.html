<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninja Mugen</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="view"></div>
<div id="ui"><div id="hud"></div><div id="screen"></div></div>
<button id="backbtn">‹ Retour</button><button id="pausebtn">II</button>
<div id="rotate"><div class="ph">📱</div><p>Tournez votre téléphone<br>en <b>mode paysage</b> pour jouer</p></div>
<div id="touch">
  <div class="dpad" id="dpad">
    <i data-d="ul">↖</i><i data-d="u">▲</i><i data-d="ur">↗</i>
    <i data-d="l">◀</i><i class="mid"></i><i data-d="r">▶</i>
    <i data-d="dl">↙</i><i data-d="d">▼</i><i data-d="dr">↘</i>
  </div>
  <div class="acts">
    <button data-a="kick" class="bt">△</button><button data-a="punch" class="bl">□</button><button data-a="special" class="br">○</button><button data-a="move2" class="bb">✕</button>
  </div>
</div>
<script>/*JS*/</script>
</body>
</html>
