<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninja Mugen</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="view"></div>
<div id="ui"><div id="hud"></div><div id="screen"></div></div>
<button id="backbtn">‹ Retour</button><button id="pausebtn">II</button>
<div id="rotate"><div class="ph">📱</div><p>Tournez votre téléphone<br>en <b>mode paysage</b> pour jouer</p></div>
<div id="touch">
  <div id="padzone"></div>
  <div id="stick"><div class="ring"></div><div class="knob"></div></div>
  <div id="dpad">
    <i data-d="ul">↖</i><i data-d="u">▲</i><i data-d="ur">↗</i>
    <i data-d="l">◀</i><i class="mid"></i><i data-d="r">▶</i>
    <i data-d="dl">↙</i><i data-d="d">▼</i><i data-d="dr">↘</i>
  </div>
  <button class="tb tb-chg" data-k="chg" data-cost="0"><i>⚡</i><span>CHARGE</span></button>
  <div id="btns">
    <button class="tb tb-atk" data-k="o"><i>⚔</i><span>ATTAQUE</span></button>
    <button class="tb tb-shd" data-k="r2"><i>🛡</i><span>BOUCLIER</span></button>
    <button class="tb tb-rush" data-k="rush" data-cost="30"><i>💨</i><span>DASH</span><u>30</u></button>
    <button class="tb tb-cast" data-k="cast" data-cost="25"><i>✦</i><span>LANCER</span><u>25</u></button>
    <button class="tb tb-s1" data-k="s1" data-cost="50"><i>★</i><span>SUPER 1</span><u>50</u></button>
    <button class="tb tb-s2" data-k="s2" data-cost="100"><i>★★</i><span>SUPER 2</span><u>100</u><em>🔒</em></button>
  </div>
</div>
<script>/*JS*/</script>
</body>
</html>
