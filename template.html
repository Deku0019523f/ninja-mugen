<body>
<div id="view"></div>
<div id="ui"><div id="hud"></div><div id="screen"></div></div>
<button id="backbtn">‹ Retour</button><button id="pausebtn">II</button>
<div id="rotate"><div class="ph">📱</div><p>Tournez votre téléphone<br>en <b>mode paysage</b> pour jouer</p></div>
<div id="touch">
  <div class="dpad">
    <button data-a="u" class="u">▲</button><button data-a="l" class="l">◀</button><button data-a="r" class="r">▶</button><button data-a="d" class="d">▼</button>
  </div>
  <div class="acts">
    <button data-a="punch" class="b1">P</button><button data-a="kick" class="b2">K</button><button data-a="special" class="b3">S</button>
    <button data-a="move2" class="b4">T</button><button data-a="super" class="b5">★</button><button data-a="smash" class="b6">P+K</button>
  </div>
</div>
