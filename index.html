<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninja Mugen</title>
<link rel="stylesheet" href="css/base.css?v=3"><link rel="stylesheet" href="css/hud.css?v=3"><link rel="stylesheet" href="css/menus.css?v=3"><link rel="stylesheet" href="css/touch.css?v=3">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div id="view"></div>
<div id="ui"><div id="hud"></div><div id="screen"></div></div>
<button id="backbtn">‹ Retour</button><button id="pausebtn">II</button>
<div id="rotate"><div class="ph">📱</div><p>Tournez votre téléphone<br>en <b>mode paysage</b> pour jouer</p></div>
<div id="touch">
  <div id="padzone"></div>
  <div id="stick"><div class="ring"></div><div class="knob"></div></div>
  <div id="dpad">
    <i data-d="ul">↖</i><i data-d="u">▲</i><i data-d="ur">↗</i>
    <i data-d="l">◀</i><i class="mid"></i><i data-d="r">▶</i>
    <i data-d="dl">↙</i><i data-d="d">▼</i><i data-d="dr">↘</i>
  </div>
  <button id="padswitch" title="Analogique / croix">🕹</button>
  <div id="acts">
    <div class="ab bt" data-a="kick">△</div><div class="ab bl" data-a="punch">□</div><div class="ab br" data-a="special">○</div><div class="ab bb" data-a="move2">✕</div>
  </div>
</div>
<script type="module" src="js/main.js?v=3"></script>
</body>
</html>
